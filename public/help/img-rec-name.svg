<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="录音名称编辑示意">
  <rect width="640" height="400" fill="#eef3f8"/>
  <rect x="20" y="16" width="600" height="368" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="36" y="32" width="568" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="50" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="start">录音名称</text>
  <text x="48" y="72" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#152033" text-anchor="start">0823VK1</text>
  <rect x="510" y="44" width="78" height="28" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="549" y="62" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">修改</text>

  <rect x="36" y="96" width="82" height="32" rx="10" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
  <rect x="36" y="96" width="24" height="32" rx="10" fill="#99f6e4" stroke="#99f6e4" stroke-width="1"/>
  <text x="48" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#115e59" text-anchor="middle">⠿</text>
  <text x="70" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#115e59" text-anchor="start">日期</text>
  <text x="106" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">×</text>
  <rect x="126" y="96" width="82" height="32" rx="10" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
  <rect x="126" y="96" width="24" height="32" rx="10" fill="#99f6e4" stroke="#99f6e4" stroke-width="1"/>
  <text x="138" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#115e59" text-anchor="middle">⠿</text>
  <text x="160" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#115e59" text-anchor="start">编号</text>
  <text x="196" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">×</text>
  <rect x="216" y="96" width="94" height="32" rx="10" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
  <rect x="216" y="96" width="24" height="32" rx="10" fill="#99f6e4" stroke="#99f6e4" stroke-width="1"/>
  <text x="228" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#115e59" text-anchor="middle">⠿</text>
  <text x="250" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#115e59" text-anchor="start">自定义</text>
  <text x="298" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">×</text>
  <rect x="324" y="98" width="56" height="28" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="352" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">添加</text>
  <text x="36" y="142" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="start">各段直接相连，不会自动加横线。需要间隔时添加空格。点 × 去掉；拖动 ⠿ 调整顺序。</text>

  <text x="36" y="168" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">日期格式</text>
  <rect x="36" y="176" width="108" height="28" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
  <text x="90" y="194" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#115e59" text-anchor="middle">月日 0829</text>
  <rect x="152" y="176" width="132" height="28" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="218" y="194" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">年月日 20260829</text>
  <text x="36" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="start">中间不加横杠，只保留数字。可选择带年份或不带年份。</text>

  <text x="36" y="244" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">起始编号</text>
  <rect x="36" y="252" width="260" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="274" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#152033" text-anchor="start">1</text>
  <text x="320" y="244" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">一轮最大值</text>
  <rect x="320" y="252" width="260" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="332" y="274" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#152033" text-anchor="start">8</text>
  <text x="36" y="302" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="start">每天自动加 1；若一轮设为 8，编号到 8 后下一天回到 1（9 不会出现）。留空表示一直递增。</text>
</svg>