<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="自动录音设置示意">
  <rect width="640" height="360" fill="#eef3f8"/>
  <rect x="20" y="16" width="600" height="328" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="36" y="44" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">停止录音后的下载方式</text>
  <rect x="36" y="50" width="568" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="72" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#152033" text-anchor="start">立即下载原始录音，并在后台生成MP3（推荐）</text>
  <text x="36" y="92" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="start">停止后立即下载原始录音</text>
  <rect x="572" y="98" width="22" height="14" rx="4" fill="#0f766e" stroke="none" stroke-width="1"/>
  <text x="36" y="118" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="start">MP3生成成功后自动下载</text>
  <rect x="572" y="124" width="22" height="14" rx="4" fill="#0f766e" stroke="none" stroke-width="1"/>
  <text x="36" y="144" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="start">默认比特率</text>
  <rect x="430" y="138" width="174" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="442" y="156" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#152033" text-anchor="start">64 kbps · 重要通话</text>
  <text x="36" y="176" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="start">声音识别灵敏度</text>
  <rect x="430" y="170" width="174" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="442" y="188" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#152033" text-anchor="start">标准</text>
  <rect x="36" y="206" width="568" height="1" rx="0" fill="#e2e8f0" stroke="none" stroke-width="1"/>
  <text x="36" y="228" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="start">检测到声音后自动开始录音</text>
  <rect x="572" y="222" width="22" height="14" rx="4" fill="#0f766e" stroke="none" stroke-width="1"/>
  <text x="36" y="254" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="start">浏览器标签页播放本地媒体时自动开始</text>
  <rect x="572" y="248" width="22" height="14" rx="4" fill="#e2e8f0" stroke="none" stroke-width="1"/>
  <text x="36" y="280" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="start">插件内播放结束后自动开始</text>
  <rect x="572" y="274" width="22" height="14" rx="4" fill="#0f766e" stroke="none" stroke-width="1"/>
  <text x="36" y="304" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="start">「标签页」：在浏览器中打开 mp3/mp4 并开始播放时自动录音。「插件内」：在下方播放器播完后再自动开始。</text>
</svg>